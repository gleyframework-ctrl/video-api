<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-400 mb-2">🎬 AI Video Studio</h1>
            <p class="text-gray-400">Upload a PDF. AI writes the script. We generate the video.</p>
        </div>

        <!-- Upload Form -->
        <div id="uploadSection" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">1. Select PDF Presentation</label>
                <input type="file" id="pdfFile" accept=".pdf" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">2. Language</label>
                <select id="language" class="w-full bg-gray-700 text-white rounded-lg p-3 border border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="ar">Arabic (العربية)</option>
                    <option value="en">English</option>
                </select>
            </div>

            <button onclick="startGeneration()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
                <span>🚀 Generate Video</span>
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingSection" class="hidden text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-400 mx-auto mb-4"></div>
            <p class="text-lg text-gray-300" id="statusText">Uploading and analyzing PDF...</p>
            <p class="text-sm text-gray-500 mt-2">This takes 1-2 minutes. Do not close this tab.</p>
        </div>

        <!-- Success State -->
        <div id="successSection" class="hidden text-center py-8">
            <div class="text-5xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-green-400 mb-2">Video Ready!</h2>
            <p class="text-gray-400 mb-6">Your AI-generated video is ready for download.</p>
            <a id="downloadLink" href="#" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition mb-4">
                ⬇️ Download MP4
            </a>
            <button onclick="location.reload()" class="text-indigo-400 hover:text-indigo-300 text-sm font-medium">
                Create Another Video
            </button is>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-900/50 border border-red-700 text-red-200 rounded-lg text-sm text-center"></div>
    </div>

    <script>
        async function startGeneration() {
            const fileInput = document.getElementById('pdfFile');
            const language = document.getElementById('language').value;
            const btn = document.getElementById('generateBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!fileInput.files[0]) {
                showError("Please select a PDF file first.");
                return;
            }

            // UI Updates
            errorMsg.classList.add('hidden');
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('language', language);
            // We don't send 'scripts', so the backend will auto-generate them using the new AI!

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Upload failed");
                
                const data = await response.json();
                const jobId = data.job_id;
                
                document.getElementById('statusText').innerText = "AI is writing scripts and rendering video...";
                pollStatus(jobId);

            } catch (error) {
                showError("Failed to start generation. Please try again.");
                resetUI();
            }
        }

        async function pollStatus(jobId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${jobId}`);
                    const data = await response.json();

                    if (data.status === 'completed') {
                        clearInterval(interval);
                        document.getElementById('loadingSection').classList.add('hidden');
                        document.getElementById('successSection').classList.remove('hidden');
                        document.getElementById('downloadLink').href = `/download/${jobId}/final_video.mp4`;
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        showError("Generation failed: " + (data.error || "Unknown error"));
                        resetUI();
                    } else {
                        document.getElementById('statusText').innerText = `Processing... (${data.progress || 50}%)`;
                    }
                } catch (error) {
                    clearInterval(interval);
                    showError("Lost connection to server.");
                    resetUI();
                }
            }, 5000); // Check every 5 seconds
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function resetUI() {
            document.getElementById('loadingSection').classList.add('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
